name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Publish APK to the "latest" release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HoloLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HoloLauncher.apk \
            --title "Holo Launcher (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap HoloLauncher.apk to install." \
            --prerelease --target "$GITHUB_SHA"

      - name: Record build status on the ci-status branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/status
          cp build.log /tmp/status/build.log 2>/dev/null || echo "no log" > /tmp/status/build.log
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/status/errors.txt 2>/dev/null || true
          echo "${GITHUB_SHA} ${{ steps.build.outcome }}" > /tmp/status/status.txt
          cd /tmp/status
          git init -q
          git checkout -q -b ci-status
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status
